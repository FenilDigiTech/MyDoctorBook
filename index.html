<!doctype html>

    <link rel="icon" type="image/svg+xml" href="/logo.svg" />

    <meta name="google-site-verification" content="32QvRafKSQ0mxr5V377IF-ixWUBSVoN-eWu-Y" />

    <!-- Open Graph / Facebook / WhatsApp SEO -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mydoctorbook.in/" />
    <meta property="og:title" content="MyDoctorBook - Official Doctor Appointment & Medical Booking Portal" />
    <meta property="og:description" content="Book 100% verified doctor consultations, OPD tickets, lab diagnostic scans, and pharmacy medicine orders online across India." />
    <meta property="og:image" content="https://mydoctorbook.in/favicon.png" />

    <!-- Twitter SEO -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://mydoctorbook.in/" />
    <meta name="twitter:title" content="MyDoctorBook - Verified Healthcare & Doctor Appointments" />
    <meta name="twitter:description" content="Book doctor consultations, lab tests, and manage prescriptions digitally." />

    <!-- Structured JSON-LD Data for Google Search Engine -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MedicalOrganization",
      "name": "MyDoctorBook",
      "url": "https://mydoctorbook.in/",
      "logo": "https://mydoctorbook.in/favicon.png",
      "description": "Official verified healthcare and doctor appointment booking platform in India.",
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+91-9876543210",
        "contactType": "customer service",
        "areaServed": "IN"
      }
    }
    </script>

    <!-- Speed Pre-connects & DNS prefetch for 98+ Page Speed -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://api.qrserver.com">
    <link rel="dns-prefetch" href="https://meet.jit.si">
    <!-- Non-render-blocking Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
